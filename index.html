<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDAURA | فريق طبي للتعليم الطبي</title>
<meta name="description" content="MEDAURA فريق طبي جامعي يقدّم دورات وورشات في التعليم الطبي.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0B5961;--navy:#142B43;--acc:#36A6A0;--mist:#F1F7F7;--ink:#20323A;--mute:#586B71;--line:#D9E6E7;--r:14px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;display:flex;flex-direction:column;min-height:100vh;font:400 16px/1.8 "IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,system-ui,sans-serif;color:var(--ink);background:#fff}
h1,h2,h3{color:var(--navy);line-height:1.4;margin:0 0 .5em;font-weight:700}h1{font-size:clamp(1.9rem,5vw,3rem)}h2{font-size:1.5rem}h3{font-size:1.1rem}
main{flex:1}a{color:var(--teal)}p>a:only-child,.tl{display:inline-block;padding:10px 0}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--teal);color:#fff;padding:8px 14px;z-index:9}.skip:focus{top:8px}
.wrap{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:5;box-shadow:0 4px 18px rgba(20,43,67,.035)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px;max-width:1080px;margin:auto}
.bar img{height:58px;width:auto;max-width:190px;display:block;object-fit:contain;transition:transform .25s ease}.bar>a:hover img{transform:translateY(-2px)}
nav{display:flex;flex-wrap:wrap;gap:2px 4px}nav a{padding:6px 10px;border-radius:6px;text-decoration:none;color:var(--navy);font-size:.92rem;font-weight:500}
nav a:hover{background:var(--mist)}nav a[aria-current=page]{background:var(--teal);color:#fff}
#mt{display:none;font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px}
@media(min-width:721px) and (max-width:1000px){.bar{flex-wrap:wrap}nav{order:3;width:100%;justify-content:center;padding-bottom:6px}}
@media(max-width:720px){#mt{display:block}nav{display:none;position:absolute;inset-inline:0;top:100%;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;flex-direction:column}nav.on{display:flex}}
section{padding:52px 0}.alt{background:var(--mist)}.ph1{background:var(--teal);color:#fff;padding:40px 0 34px;position:relative;overflow:hidden}.ph1 h1{color:#fff;margin:0 0 6px}.ph1 .lead{color:#CFE8E6;margin:0}.ph1:after{content:'';position:absolute;inset-inline-end:-40px;bottom:-60px;width:180px;height:180px;border:3px solid var(--acc);border-radius:999px 999px 0 0;opacity:.55}
.hero{background:radial-gradient(ellipse at 78% 15%,rgba(54,166,160,.18),transparent 38%),linear-gradient(135deg,#0B5961 0%,#123E50 100%);color:#fff;padding:56px 0 0;overflow:hidden;position:relative;isolation:isolate}
.hero .wrap{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:end}
.hero h1{color:#fff}.hero p{color:#CFE8E6;max-width:34ch}
.arch{width:min(330px,100%);min-height:300px;aspect-ratio:4/4.5;border-radius:180px 180px 20px 20px;overflow:hidden;justify-self:center;margin-bottom:0;background:linear-gradient(145deg,#fff 0%,#F0F8F7 100%);display:flex;align-items:center;justify-content:center;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.13);border:1px solid rgba(255,255,255,.6);animation:logoFloat 5s ease-in-out infinite}
.hero-logo{display:block;width:100%;max-width:290px;height:auto;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(20,43,67,.07))}.thread{position:absolute;inset-inline-end:0;top:10px;width:46%;opacity:.6;pointer-events:none;z-index:0}.hero .wrap>div{position:relative;z-index:1}
@media(max-width:700px){.hero{padding-top:38px}.hero .wrap{grid-template-columns:1fr;gap:26px}.arch{width:230px;min-height:230px;padding:20px}.hero-logo{max-width:205px}.thread{display:none}.bar img{height:50px;max-width:155px}}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 28px}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:700;border:2px solid var(--teal);background:var(--teal);color:#fff}
.btn.w{background:#fff;color:var(--teal);border-color:#fff}.btn.o{background:transparent;color:inherit;border-color:currentColor}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;display:block;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;transition:border-color .22s,transform .22s,box-shadow .22s;box-shadow:0 5px 18px rgba(20,43,67,.025)}
.card:hover{border-color:var(--acc);transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,43,67,.08)}
.ph{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;object-fit:cover;background:#E3EEEE;color:var(--teal);font-size:.85rem;padding:12px}
.card .ph{height:150px}
.chip{position:absolute;top:10px;inset-inline-start:10px;background:var(--navy);color:#fff;font-size:.8rem;padding:2px 12px;border-radius:99px}
.s-open{background:var(--teal)}.s-done{background:var(--mute)}
.cb{padding:14px 16px}.cat{color:var(--acc);font-weight:700}
.meta{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--mute);font-size:.88rem}
.cf{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:8px;font-size:.9rem}.cf b{color:var(--teal)}
.smp{position:absolute;top:10px;inset-inline-end:10px;font-style:normal;background:#fff;color:var(--mute);border:1px dashed var(--mute);font-size:.75rem;padding:0 8px;border-radius:99px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--mute);background:#fff}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}.fl button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 16px;cursor:pointer}
.fl button[aria-pressed=true]{background:var(--teal);color:#fff;border-color:var(--teal)}
input[type=search]{font:inherit;width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:18px}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}@media(max-width:700px){.two{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.lead{color:var(--mute);max-width:60ch}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
footer{background:var(--navy);color:#CBD7DD;padding:28px 0;font-size:.9rem}footer a{color:#fff}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:28px}.dt .ph{height:260px;border-radius:var(--r)}@media(max-width:700px){.dt{grid-template-columns:1fr}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes introIn{0%{opacity:0;transform:translateY(12px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}}
#intro{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:linear-gradient(145deg,#fff 0%,#F1F7F7 100%);animation:introOut .65s ease 1.45s forwards}
#intro .intro-inner{display:flex;flex-direction:column;align-items:center;gap:18px;padding:28px;animation:introIn .8s cubic-bezier(.2,.75,.25,1) both}
#intro img{display:block;width:min(68vw,300px);height:auto;max-height:44vh;object-fit:contain}
#intro .intro-mark{width:44px;height:3px;border-radius:99px;background:var(--acc);transform-origin:center;animation:markPulse 1s ease-in-out infinite alternate}
@keyframes markPulse{from{transform:scaleX(.45);opacity:.55}to{transform:scaleX(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}#intro{display:none!important}}

/* Premium finishing touches: quiet motion, layered depth, and clear navigation */
html{scroll-padding-top:90px}
body{overflow-x:hidden}
#scroll-progress{position:fixed;top:0;right:0;width:0;height:3px;background:linear-gradient(90deg,#36A6A0,#B7E8DF);z-index:1200;box-shadow:0 0 12px rgba(54,166,160,.45);transition:width .08s linear}
header{transition:box-shadow .25s ease,background .25s ease}
header.scrolled{box-shadow:0 8px 28px rgba(20,43,67,.10);background:rgba(255,255,255,.97)}
.hero{min-height:390px}
.hero:before{content:"";position:absolute;inset:-30% auto auto -12%;width:380px;height:380px;border:1px solid rgba(207,232,230,.15);border-radius:50%;box-shadow:0 0 0 34px rgba(207,232,230,.035),0 0 0 70px rgba(207,232,230,.025);pointer-events:none;animation:orbitBreath 9s ease-in-out infinite}
.hero:after{content:"";position:absolute;left:12%;bottom:15%;width:7px;height:7px;border-radius:50%;background:#B7E8DF;box-shadow:0 0 0 7px rgba(183,232,223,.10),0 0 24px rgba(183,232,223,.35);animation:dotPulse 3s ease-in-out infinite}
.hero .wrap{padding-bottom:0}
.btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .22s ease,box-shadow .22s ease,background .22s ease}
.btn:before{content:"";position:absolute;top:-80%;bottom:-80%;left:-45%;width:24%;background:rgba(255,255,255,.25);transform:rotate(22deg) translateX(-220%);transition:transform .65s ease;z-index:-1}
.btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(11,89,97,.20)}.btn:hover:before{transform:rotate(22deg) translateX(650%)}
.card{transform:translateY(0);transition:border-color .25s,transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 38px rgba(20,43,67,.11)}
section .wrap>h2{letter-spacing:-.02em}
section .wrap>h2:after{content:"";display:block;width:42px;height:3px;background:var(--acc);border-radius:9px;margin-top:9px}
.box{transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease}.box:hover{border-color:rgba(54,166,160,.55);box-shadow:0 12px 30px rgba(20,43,67,.055)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s cubic-bezier(.2,.7,.2,1)}.reveal.in-view{opacity:1;transform:translateY(0)}
#back-top{position:fixed;bottom:22px;inset-inline-end:22px;width:44px;height:44px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer;z-index:20;box-shadow:0 8px 24px rgba(20,43,67,.2);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .25s,transform .25s,visibility .25s,background .25s}
#back-top.show{opacity:1;visibility:visible;transform:translateY(0)}#back-top:hover{background:var(--teal);transform:translateY(-3px)}
#intro{background:radial-gradient(ellipse at center, #fff 0%, #F1F7F7 68%, #E6F2F1 100%)}#intro:after{content:"";position:absolute;width:min(80vw,390px);aspect-ratio:1;border:1px solid rgba(54,166,160,.16);border-radius:50%;animation:introRing 2.2s ease-out infinite;pointer-events:none}#intro .intro-inner{position:relative;z-index:1}#intro img{animation:logoFloat 4.5s ease-in-out infinite}
@keyframes orbitBreath{0%,100%{transform:translate(0,0) scale(1);opacity:.8}50%{transform:translate(14px,10px) scale(1.04);opacity:.45}}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.25);opacity:1}}
@keyframes introRing{0%{transform:scale(.72);opacity:0}35%{opacity:.8}100%{transform:scale(1.12);opacity:0}}
@media(max-width:700px){.hero{min-height:0}.hero:before{width:240px;height:240px;left:-35%}.hero:after{left:8%;bottom:34%}#back-top{bottom:14px;inset-inline-end:14px;width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}#back-top{transition:none}}

/* MEDAURA signature language: THE LEARNING PULSE */
:root{--pulse:#9AE4D6;--pulse-ink:#092E3A;--pulse-glow:rgba(154,228,214,.23)}
.hero{background:radial-gradient(ellipse at 78% 15%,rgba(54,166,160,.22),transparent 38%),linear-gradient(125deg,#082F3B 0%,#0B5961 57%,#123E50 100%)}
.hero .wrap{align-items:center;min-height:400px}
.hero-kicker{display:inline-flex;align-items:center;gap:9px;padding:5px 12px;border:1px solid rgba(183,232,223,.26);border-radius:99px;background:rgba(255,255,255,.055);backdrop-filter:blur(8px)}
.hero-kicker:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pulse);box-shadow:0 0 0 4px rgba(154,228,214,.12),0 0 16px var(--pulse);animation:signal 2s ease-in-out infinite}
.arch{position:relative;isolation:isolate;border-radius:48% 48% 24px 24px;box-shadow:0 28px 80px rgba(0,0,0,.23),inset 0 0 0 1px #fff;background:linear-gradient(145deg,#fff,#eaf6f4)}
.arch:before,.arch:after{content:"";position:absolute;inset:-17px;border:1px solid rgba(183,232,223,.48);border-radius:48% 48% 28px 28px;z-index:-1;animation:frameBreath 6s ease-in-out infinite}
.arch:after{inset:-32px;border-color:rgba(183,232,223,.18);animation-delay:-3s}
.hero-logo{position:relative;z-index:2;animation:logoReveal 1.15s cubic-bezier(.2,.8,.2,1) both;}
.pulse-orbit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.pulse-orbit circle.track{fill:none;stroke:rgba(183,232,223,.2);stroke-width:1;stroke-dasharray:3 8}
.pulse-orbit .satellite{fill:#B7E8DF;filter:drop-shadow(0 0 5px #9AE4D6);transform-origin:50% 50%;animation:orbitSpin 16s linear infinite}
.impact-section{position:relative;overflow:hidden;background:#F4F9F8;padding:62px 0}
.impact-section:before{content:"";position:absolute;width:390px;height:390px;border:1px solid rgba(11,89,97,.08);border-radius:50%;inset-inline-start:-160px;top:-220px;box-shadow:0 0 0 28px rgba(11,89,97,.025),0 0 0 58px rgba(11,89,97,.018);pointer-events:none}
.impact-panel{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:28px;padding:clamp(22px,4vw,42px);border-radius:24px;color:#fff;background:linear-gradient(120deg,#092F3B,#0B5961 72%,#145563);overflow:hidden;box-shadow:0 24px 60px rgba(9,47,59,.13)}
.impact-panel:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(183,232,223,.17);border-radius:50%;inset-inline-end:-80px;top:-140px;box-shadow:0 0 0 25px rgba(183,232,223,.035),0 0 0 55px rgba(183,232,223,.025);pointer-events:none}
.impact-copy,.impact-figure{position:relative;z-index:1}.impact-eyebrow{display:flex;align-items:center;gap:9px;color:#B7E8DF;font-size:.78rem;font-weight:700;letter-spacing:.13em}.impact-eyebrow:before{content:"";height:1px;width:26px;background:#9AE4D6}.impact-panel h2{color:#fff;font-size:clamp(1.45rem,3vw,2.2rem);margin:9px 0}.impact-panel p{color:#D0E8E6;max-width:46ch;margin:0}.impact-number{font-size:clamp(2.8rem,7vw,5.3rem);line-height:1.08;font-weight:700;letter-spacing:-.055em;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 28px rgba(154,228,214,.15)}.impact-number:after{content:"+";font-size:.45em;color:#9AE4D6;margin-inline-start:5px}.impact-caption{display:block;color:#B7E8DF;font-size:.9rem;margin-top:8px}.impact-figure{width:140px;height:140px;display:grid;place-items:center;border:1px solid rgba(183,232,223,.24);border-radius:50%;background:rgba(255,255,255,.035)}.impact-figure svg{width:105px;height:105px;overflow:visible}.impact-figure .orbit{fill:none;stroke:rgba(183,232,223,.32);stroke-width:1.3;stroke-dasharray:2 5;transform-origin:50% 50%;animation:orbitSpin 24s linear infinite}.impact-figure .core{fill:#9AE4D6;filter:drop-shadow(0 0 9px rgba(154,228,214,.7));animation:corePulse 3s ease-in-out infinite}.impact-figure .node{fill:#fff;animation:signal 2.4s ease-in-out infinite}.impact-unset{font-size:1.05rem;letter-spacing:0;color:#fff;text-shadow:none}.impact-unset:after{content:""}
@keyframes signal{0%,100%{opacity:.65;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
@keyframes frameBreath{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.025);opacity:.3}}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes logoReveal{from{opacity:0;transform:translateY(10px) scale(.96);filter:blur(3px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes corePulse{0%,100%{r:9;opacity:.85}50%{r:12;opacity:1}}
@media(max-width:700px){.hero .wrap{min-height:0}.arch{margin:8px auto 24px}.impact-panel{grid-template-columns:1fr;gap:22px}.impact-figure{width:100px;height:100px;grid-row:1}.impact-figure svg{width:76px;height:76px}.impact-number{font-size:3.5rem}}
@media(prefers-reduced-motion:reduce){.hero-kicker:before,.arch:before,.arch:after,.hero-logo,.pulse-orbit .satellite,.impact-figure .orbit,.impact-figure .core,.impact-figure .node{animation:none!important}}


/* SIGNATURE EXPERIENCE — MEDAURA's own visual language */
:root{--signature:#0a3642;--mint:#a5eadb;--paper:#f7fbfa;--gold:#d8c69b}
.hero{background:radial-gradient(circle at 72% 40%,rgba(90,198,181,.19),transparent 26%),linear-gradient(125deg,#071f2b 0%,#0a4652 56%,#0c6670 100%)}
.hero:after{background:var(--mint);box-shadow:0 0 0 8px rgba(165,234,219,.10),0 0 32px rgba(165,234,219,.6)}
.hero h1{max-width:13ch;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--mint);position:relative;white-space:nowrap}
.hero h1 em:after{content:"";position:absolute;inset-inline:0;bottom:-5px;height:2px;background:linear-gradient(90deg,transparent,var(--mint),transparent);transform:scaleX(0);transform-origin:center;animation:signatureUnderline 1s .7s ease forwards}
.hero .arch{background:radial-gradient(circle at 50% 45%,#fff 0%,#effaf7 67%,#d9efeb 100%);border:1px solid rgba(255,255,255,.8)}
.hero-kicker{letter-spacing:.08em!important}
.signature-section{padding:76px 0;background:#071f2b;color:#eaf7f5;position:relative;overflow:hidden}
.signature-section:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(165,234,219,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(165,234,219,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);pointer-events:none}
.signature-section .wrap{position:relative}
.signature-heading{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:30px}
.signature-heading h2{color:#fff;font-size:clamp(1.7rem,4vw,2.65rem);max-width:16ch;margin:0}
.signature-heading p{color:#a9c7c9;max-width:34ch;margin:0}
.constellation{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:35px 0 12px}
.constellation-line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.constellation-line path{fill:none;stroke:rgba(165,234,219,.36);stroke-width:1.4;stroke-dasharray:5 8;animation:threadFlow 22s linear infinite}
.constellation-link{position:relative;z-index:1;min-height:174px;padding:20px 17px;border-radius:18px;text-decoration:none;color:#eaf7f5;background:linear-gradient(150deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid rgba(165,234,219,.2);backdrop-filter:blur(10px);transition:transform .3s,border-color .3s,background .3s,box-shadow .3s}
.constellation-link:hover,.constellation-link:focus-visible{transform:translateY(-7px);border-color:var(--mint);background:rgba(165,234,219,.09);box-shadow:0 18px 45px rgba(0,0,0,.2)}
.constellation-icon{width:44px;height:44px;display:grid;place-items:center;border:1px solid rgba(165,234,219,.38);border-radius:14px;color:var(--mint);font-size:1.25rem;margin-bottom:23px;background:rgba(165,234,219,.06)}
.constellation-link small{display:block;color:#91b7ba;letter-spacing:.12em;font-size:.68rem;margin-bottom:5px}
.constellation-link strong{display:block;font-size:1.08rem;color:#fff}
.constellation-link span:last-child{display:block;color:#b9d2d2;font-size:.85rem;margin-top:6px}
.signature-endnote{display:flex;align-items:center;gap:12px;color:#8eb8bb;font-size:.84rem;margin-top:18px}
.signature-endnote:before{content:"";width:34px;height:1px;background:var(--mint)}
.path-section{background:var(--paper)}
.path-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:30px;position:relative}
.path-step{position:relative;padding:25px 26px 26px;border-top:1px solid var(--line)}
.path-step:before{content:attr(data-step);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#0a3642;color:var(--mint);font-weight:700;border:5px solid #e5f2ef;box-shadow:0 0 0 1px #b9d8d3;margin-bottom:18px}
.path-step:not(:last-child):after{content:"";position:absolute;top:45px;inset-inline-end:-1px;width:1px;height:calc(100% - 65px);background:linear-gradient(var(--acc),transparent);opacity:.6}

};

// Our Work: published activity stories and media.
const workVideo=u=>{try{const x=new URL(u);let id='';if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(x.hostname)){id=x.searchParams.get('v')||((x.pathname.match(/^\/(?:shorts|embed)\/([\w-]{11})/)||[])[1])||''}else if(x.hostname==='youtu.be')id=x.pathname.slice(1).split('/')[0];if(id&&/^[\w-]{11}$/.test(id))return `<div class="work-video"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="فيديو MEDAURA" loading="lazy" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;if(x.protocol==='https:'&&/\.mp4(?:$|\?)/i.test(x.pathname))return `<div class="work-video"><video controls preload="metadata" src="${esc(x.href)}"></video></div>`}catch(e){}return `<p>رابط الفيديو غير مدعوم. استخدم رابط YouTube أو ملف MP4 مباشر عبر HTTPS.</p>`};
V.work=()=>head('أعمالنا','نوثّق رحلتنا في التعليم الطبي: الدورات والورشات واللحظات التي صنعت فرقًا.')+`<section><div class="wrap"><span class="path-label">MEDAURA · OUR WORK</span>${D.work?.length?`<div class="work-grid">${D.work.map(w=>`<a class="work-card" href="#/work-post/${encodeURIComponent(w.id)}">${w.cover_url&&safe(w.cover_url)?`<img class="work-cover" src="${esc(w.cover_url)}" alt="${esc(w.title)}" loading="lazy">`:`<div class="work-cover"></div>`}<div class="work-card-body"><small>${esc(w.activity_date?fmt(w.activity_date):'MEDAURA TEAM')}</small><h2>${esc(w.title)}</h2><p>${esc(w.excerpt||'اقرأ تفاصيل النشاط وشاهد التوثيق')}</p><span class="cat">اقرأ القصة ←</span></div></a>`).join('')}</div>`:empty('أعمال MEDAURA','ستظهر الدورات والورشات السابقة بعد نشرها من لوحة الإدارة.')}</div></section>`;
V['work-post']=id=>{const w=(D.work||[]).find(x=>x.id===id);if(!w)return head('العمل غير متاح','هذا النشاط غير منشور أو الرابط غير صحيح.')+`<section><div class="wrap"><a href="#/work">العودة إلى أعمالنا ←</a></div></section>`;return `<section><div class="wrap"><article class="work-article"><a class="work-back" href="#/work">← العودة إلى أعمالنا</a>${w.cover_url&&safe(w.cover_url)?`<img class="work-cover" src="${esc(w.cover_url)}" alt="${esc(w.title)}">`:''}<h1>${esc(w.title)}</h1><p class="work-meta">${esc(w.activity_date?fmt(w.activity_date):'')} ${w.location?' · '+esc(w.location):''}</p>${w.excerpt?`<p class="lead">${esc(w.excerpt)}</p>`:''}${(Array.isArray(w.blocks)?w.blocks:[]).map(b=>{if(b.type==='heading')return `<div class="work-block"><h2>${esc(b.text)}</h2></div>`;if(b.type==='text')return `<div class="work-block"><p>${esc(b.text)}</p></div>`;if(b.type==='image'&&safe(b.url))return `<figure><img src="${esc(b.url)}" alt="${esc(b.caption||w.title)}" loading="lazy">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:''}</figure>`;if(b.type==='video')return `<div class="work-block">${workVideo(b.url)}${b.caption?`<p class="work-meta">${esc(b.caption)}</p>`:''}</div>`;return ''}).join('')}</article></div></section>`};

function paint(){const h=location.hash.replace(/^#\/?/,''),[p,id]=h.split('/'),v=(p==='events'||p==='event')?V['']:(V[p]||V['']);$('#app').innerHTML=v(id);
const cur=p==='course'?'courses':p==='event'?'events':p||'';document.querySelectorAll('nav a').forEach(a=>{a.dataset.p===cur?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
$('#nv').classList.remove('on');document.title=(($('#app h1')||{}).textContent||'الرئيسية')+' | MEDAURA';window.scrollTo(0,0);
if(p==='courses'){let filter='all',query='';const draw=()=>{$('#cg').innerHTML=grid(D.courses.filter(c=>(filter==='all'||c.status===filter)&&((c.title+' '+c.cat+' '+c.level+' '+c.summary).toLocaleLowerCase().includes(query.toLocaleLowerCase()))),card,'ما لقينا دورات مطابقة — جرّب كلمة ثانية أو غيّر التصنيف.');};draw();
document.querySelectorAll('.fl button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('.fl button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});const cq=$('#course-q');if(cq)cq.oninput=e=>{query=e.target.value.trim();draw()}}
if(p==='resources'){const draw=t=>{const q=t.toLocaleLowerCase();const r=D.resources.filter(x=>(x.title+' '+x.cat+' '+x.type).toLocaleLowerCase().includes(q));$('#rl').innerHTML=r.length?r.map(x=>`<div class="row resource-row"><span><b>${esc(x.title)}</b> ${smp(x)}<br><small class="lead">${esc(x.cat)} · ${esc(x.type||'مورد تعليمي')}</small></span>${safe(x.url)?`<a href="${esc(x.url)}" target="_blank" rel="noopener">فتح المورد ↗</a>`:'<span class="lead">الرابط لم يُضف بعد</span>'}</div>`).join(''):empty('ما لقينا نتائج مطابقة','جرّب كلمة ثانية أو تصنيفًا مختلفًا.')};draw('');$('#q').oninput=e=>draw(e.target.value.trim())}}
$('#mt').onclick=()=>{const o=$('#nv').classList.toggle('on');$('#mt').setAttribute('aria-expanded',o)};
$('#ft').innerHTML='<p><bdi>MEDAURA Medical Team</bdi> <span style="color:#9AE4D6">· نتعلّم. نتدرّب. نرتقي.</span></p><p>© جميع الحقوق محفوظة.</p>';
const progress=$('#scroll-progress'),topBtn=$('#back-top'),header=document.querySelector('header');
function onScroll(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.width=(max>0?scrollY/max*100:0)+'%';topBtn.classList.toggle('show',scrollY>420);header.classList.toggle('scrolled',scrollY>8)}
addEventListener('scroll',onScroll,{passive:true});onScroll();
topBtn.addEventListener('click',()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
function revealSections(){const nodes=document.querySelectorAll('#app section:not(.hero),#app .card,#app .box');if(!('IntersectionObserver' in window)){nodes.forEach(n=>n.classList.add('in-view'));return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -24px 0px'});nodes.forEach((n,i)=>{if(!n.classList.contains('reveal')){n.classList.add('reveal');n.style.transitionDelay=(Math.min(i%4,3)*65)+'ms'}io.observe(n)})}
const observer=new MutationObserver(()=>revealSections());observer.observe($('#app'),{childList:true,subtree:true});
addEventListener('hashchange',()=>{paint();revealSections();setupImpact()});window.MEDAURA_REFRESH=()=>{paint();revealSections();setupImpact()};paint();revealSections();setupImpact();
// Learning Lab: all data remains on this browser; no network requests.
const LAB_KEY='medaura-learning-lab-v1',LAB_DAYS=[1,3,7,14,30];
function labLoad(){try{const v=JSON.parse(localStorage.getItem(LAB_KEY)||'[]');return Array.isArray(v)?v.filter(x=>x&&typeof x==='object').slice(0,300):[]}catch{return []}}
let labEntries=labLoad();
function labSave(){try{localStorage.setItem(LAB_KEY,JSON.stringify(labEntries));return true}catch{$('#lab-status').textContent='تعذّر الحفظ على هذا المتصفح. جرّب تصدير نسخة احتياطية.';return false}}
function labDate(day){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+day);return d.toISOString().slice(0,10)}
function labFormat(iso){return new Date(iso+'T12:00:00').toLocaleDateString('ar',{year:'numeric',month:'short',day:'numeric'})}
function labRender(){const sessions=$('#lab-sessions'),upcoming=$('#lab-upcoming');if(!sessions||!upcoming)return;$('#lab-count').textContent='('+labEntries.length+')';sessions.innerHTML=labEntries.length?labEntries.slice().reverse().slice(0,8).map(x=>`<div class="lab-entry"><div><strong>${esc(x.topic)}</strong><small>${esc(x.subject||'بدون مادة')} · ${esc(x.created.slice(0,10))}</small></div><button type="button" data-lab-delete="${esc(x.id)}">حذف</button></div>`).join(''):'ما في محاضرات محفوظة بعد.';const tasks=labEntries.flatMap(x=>LAB_DAYS.map(day=>({x,day,date:x.reviews?.[day]?.date||x.created.slice(0,10),done:!!x.reviews?.[day]?.done}))).filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,10);upcoming.innerHTML=tasks.length?tasks.map(t=>`<div class="lab-entry"><div><strong>${esc(t.x.topic)}</strong><small>مراجعة اليوم ${t.day} · ${labFormat(t.date)}${t.date<labDate(0)?' · متأخرة':''}</small></div><button type="button" data-lab-done="${esc(t.x.id)}" data-day="${t.day}">أنجزت</button></div>`).join(''):'كل المراجعات منجزة، أو ما في جلسات بعد.'}
function labDownload(filename,contents,type){const blob=new Blob([contents],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
document.addEventListener('submit',e=>{if(e.target.id!=='learning-card')return;e.preventDefault();const f=new FormData(e.target),v=k=>String(f.get(k)||'').trim(),topic=v('topic');if(!topic)return;const created=new Date().toISOString(),reviews={};LAB_DAYS.forEach(day=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+day);reviews[day]={date:[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),done:false}});labEntries.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),topic,subject:v('subject'),learned:v('learned'),next:v('next'),confidence:v('confidence'),created,reviews});if(labEntries.length>300)labEntries=labEntries.slice(-300);if(labSave()){$('#lab-status').textContent='تم حفظ الجلسة وإنشاء خمس مراجعات. ممتاز!';e.target.reset()}labRender()});
document.addEventListener('click',e=>{const done=e.target.closest('[data-lab-done]'),del=e.target.closest('[data-lab-delete]');if(done){const x=labEntries.find(v=>v.id===done.dataset.labDone),r=x?.reviews?.[done.dataset.day];if(r){r.done=true;labSave();labRender()}}if(del){if(!confirm('حذف هذه الجلسة ومراجعاتها؟'))return;labEntries=labEntries.filter(v=>v.id!==del.dataset.labDelete);labSave();labRender()}});
$('#lab-export')?.addEventListener('click',()=>labDownload('medaura-learning-lab-backup.json',JSON.stringify({app:'MEDAURA Learning Lab',version:1,entries:labEntries},null,2),'application/json'));
$('#lab-import')?.addEventListener('click',()=>$('#lab-import-file').click());
$('#lab-import-file')?.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw Error('الملف كبير');const obj=JSON.parse(await file.text());if(obj.app!=='MEDAURA Learning Lab'||!Array.isArray(obj.entries))throw Error('صيغة الملف غير صحيحة');const safe=obj.entries.slice(0,300).filter(x=>typeof x.id==='string'&&typeof x.topic==='string'&&typeof x.created==='string'&&x.reviews&&typeof x.reviews==='object').map(x=>({id:x.id.slice(0,80),topic:x.topic.slice(0,100),subject:String(x.subject||'').slice(0,70),learned:String(x.learned||'').slice(0,1200),next:String(x.next||'').slice(0,700),confidence:String(x.confidence||''),created:x.created.slice(0,30),reviews:Object.fromEntries(LAB_DAYS.map(day=>[day,{date:/^\d{4}-\d{2}-\d{2}$/.test(String(x.reviews[day]?.date||''))?x.reviews[day].date:labDate(day),done:x.reviews[day]?.done===true}]))}));if(!confirm('استبدال الجلسات الحالية بالنسخة المستوردة؟'))return;labEntries=safe;labSave();labRender();$('#lab-status').textContent='تم استيراد النسخة الاحتياطية.'}catch(err){$('#lab-status').textContent='تعذر الاستيراد: '+err.message}finally{e.target.value=''}});
$('#lab-print')?.addEventListener('click',()=>{const w=window.open('','_blank');if(!w){$('#lab-status').textContent='اسمح بالنوافذ المنبثقة لطباعة الملخص.';return}const rows=labEntries.map(x=>`<article><h2>${esc(x.topic)}</h2><p>${esc(x.subject||'')} · ${esc(x.created.slice(0,10))}</p><h3>استرجاعي</h3><p>${esc(x.learned)}</p><h3>نقاط تحتاج مراجعة</h3><p>${esc(x.next)}</p><p>المراجعات: ${LAB_DAYS.map(d=>d+' يوم '+(x.reviews?.[d]?.done?'✓':'○')).join(' · ')}</p></article>`).join('');w.document.write(`<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><title>MEDAURA Learning Lab</title><style>body{font:16px/1.8 Arial,sans-serif;max-width:820px;margin:35px auto;color:#143c43;padding:20px}article{border:1px solid #cbded9;border-radius:12px;padding:18px;margin:15px 0;break-inside:avoid}h1{color:#075963}p{white-space:pre-wrap}@media print{body{margin:0}}</style><h1>MEDAURA · Learning Lab</h1><p>Learn. Apply. Save Lives.</p>${rows||'<p>لا توجد جلسات محفوظة.</p>'}<script>window.onload=()=>window.print()<\/script></html>`);w.document.close()});
labRender();
</script>
