<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEDAURA | لوحة الإدارة</title><link rel="icon" href="../logo.png"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:#163444;background:#f2f7f7}*{box-sizing:border-box}body{margin:0}header{background:#123349;color:white;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px}header a{color:#c4eee8}header img{width:42px;height:42px;object-fit:contain;vertical-align:middle}main{max-width:1100px;margin:35px auto;padding:0 18px}section,.panel{background:white;border:1px solid #d8e7e6;border-radius:17px;padding:25px;margin:18px 0;box-shadow:0 8px 26px #1233490a}h1,h2{margin:0 0 15px}h1{font-size:1.55rem}h2{font-size:1.15rem}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;border:1px solid #b9d0d1;border-radius:9px;padding:11px;font:inherit;background:#fff;color:#183846}textarea{min-height:100px}button{background:#0b5961;color:#fff;border:0;border-radius:9px;padding:11px 18px;font:inherit;cursor:pointer}button.secondary{background:#e7f2f1;color:#0b5961}button.danger{background:#a52d3a}button:disabled{opacity:.55;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar button[aria-pressed=true]{background:#123349}.item{padding:14px;border:1px solid #d8e7e6;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.item small{color:#54717a}.item button{margin:2px}.muted{color:#5e757b}.msg{padding:12px;border-radius:10px;background:#e9f5f3;white-space:pre-wrap}.msg.error{background:#fff0f0;color:#8e2734}[hidden]{display:none!important}#login{max-width:470px;margin:60px auto}#preview{max-width:190px;max-height:130px;object-fit:cover;margin:8px 0;border-radius:8px}.chip{display:inline-block;padding:2px 9px;background:#e4f3f1;border-radius:50px;font-size:.8rem}footer{text-align:center;padding:30px;color:#61777c}@media(max-width:600px){section{padding:17px}.item{display:block}}
</style></head><body><header><div><img src="../logo.png" alt="MEDAURA"> <strong>MEDAURA · Admin</strong></div><a href="../">العودة للموقع ↗</a></header><main>
<section id="login"><h1>تسجيل دخول الإدارة</h1><p class="muted">الحسابات المصرّح لها فقط يمكنها إدارة المحتوى.</p><form id="login-form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><p><button type="submit">دخول آمن</button></p></form></section>
<div id="dashboard" hidden><section><div class="row"><div><h1>لوحة إدارة MEDAURA</h1><p id="who" class="muted"></p></div><div style="text-align:left"><button id="logout" class="secondary">تسجيل خروج</button></div></div><div class="toolbar"><button type="button" data-tab="courses" aria-pressed="true">الدورات</button><button type="button" data-tab="events" aria-pressed="false">الفعاليات</button><button type="button" id="v2-team-tab" class="secondary">أعضاء الفريق</button><button type="button" id="v2-gallery-tab" class="secondary">معرض الصور</button><button type="button" id="v2-settings-tab" class="secondary">إعدادات الموقع</button></div><p class="muted">المحتوى بحالة «مسودة» لن يظهر للزوار. التعديلات تُحفظ مباشرة في قاعدة البيانات.</p></section>
<section id="v2-panel" hidden></section><div id="legacy-panels"><section><h2 id="form-title">إضافة دورة</h2><form id="entry-form"><input type="hidden" id="entry-id"><label for="title">العنوان *</label><input id="title" maxlength="180" required><label for="description">الوصف</label><textarea id="description" maxlength="5000"></textarea><div class="row"><div><label for="location">المكان / طريقة الانعقاد</label><input id="location" maxlength="180"></div><div id="instructor-wrap"><label for="instructor">المحاضر</label><input id="instructor" maxlength="180"></div></div><div class="row"><div><label for="date">التاريخ والوقت</label><input id="date" type="datetime-local"></div><div><label for="status">الحالة</label><select id="status"></select></div></div><label for="registration">رابط التسجيل (اختياري)</label><input id="registration" type="url" placeholder="https://..."><label for="image">صورة JPG / PNG / WebP (حتى 20 MB)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" alt="معاينة الصورة" hidden><div class="toolbar"><button id="save" type="submit">حفظ</button><button id="clear" type="button" class="secondary">إلغاء التعديل / جديد</button></div></form></section>
<section><h2 id="list-title">الدورات المسجلة</h2><div id="entries">جارٍ التحميل...</div></section></div></div><p id="message" role="status" aria-live="polite" hidden></p></main><footer>MEDAURA · Learn. Apply. Save Lives.</footer>
<script src="../supabase-config.js"></script><script type="module" src="admin.js"></script><script type="module" src="v2.js"></script></body></html>
